# HTTP mode: one long-running container any MCP client can reach at http://localhost:8000/mcp
#   docker compose up -d --build
services:
  scraper-mcp:
    build:
      context: .
      target: runtime
    image: scraper-mcp:latest
    container_name: scraper-mcp
    command: ["--transport", "http"]
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; see README to expose it to ChatGPT
    volumes:
      - ./data:/data            # the DuckDB file and exports live here, visible on the host
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status != 200)"]
      interval: 30s
      timeout: 5s
      retries: 3
