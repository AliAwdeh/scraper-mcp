[project]
name = "scraper-mcp"
version = "0.1.0"
description = "An MCP server that scrapes the web with a multi-agent LLM pipeline and returns reproducible statistics."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=2.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "markdownify>=1.1",
    "trafilatura>=2.0",
    "playwright>=1.55",
    "ddgs>=9.0",
    "duckdb>=1.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[project.scripts]
scraper-mcp = "scraper_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_mcp"]

[tool.uv]
# Supply-chain guard: only resolve releases that have been public for 2+ weeks.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
